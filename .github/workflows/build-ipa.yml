name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: 📱 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install dependencies
        run: npm install

      - name: 🚀 Expo Prebuild (Generate iOS Native Project)
        run: npx expo prebuild --platform ios --no-install

      - name: 🥥 Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: 🛠️ Build iOS App (Unsigned for Sideloading)
        run: |
          cd ios
          export NODE_BINARY=$(which node)
          export PATH="$PATH:$(dirname $NODE_BINARY)"

          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | grep -v "Pods" | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            echo "Error: No .xcworkspace found"
            ls -la
            exit 1
          fi
          SCHEME="${WORKSPACE%.xcworkspace}"

          echo "========================================"
          echo "Building Workspace: $WORKSPACE"
          echo "Target Scheme:      $SCHEME"
          echo "Node Binary:        $NODE_BINARY"
          echo "========================================"

          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGNING_ALLOWED="NO" \
            CODE_SIGNING_REQUIRED="NO" \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: 📦 Package into .ipa
        run: |
          cd ios
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app file not found in build directory"
            find build -name "*.app"
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r -q GirlsSafety.ipa Payload
          echo "IPA Created Successfully:"
          ls -lh GirlsSafety.ipa

      - name: ⬇️ Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GirlsSafety-iOS-IPA
          path: ios/GirlsSafety.ipa
          retention-days: 7
