name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: 📱 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install dependencies
        run: npm install

      - name: 🚀 Expo Prebuild (Generate iOS Native Project)
        run: npx expo prebuild --platform ios --no-install

      - name: 🥥 Install CocoaPods
        run: |
          cd ios
          pod install

      - name: 🛠️ Build iOS Archive (Unsigned)
        run: |
          cd ios
          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | grep -v "Pods" | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            echo "Error: No .xcworkspace found in ios directory"
            ls -la
            exit 1
          fi
          SCHEME="${WORKSPACE%.xcworkspace}"
          echo "========================================"
          echo "Building Workspace: $WORKSPACE"
          echo "Target Scheme:      $SCHEME"
          echo "========================================"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: 📦 Package into .ipa
        run: |
          cd ios
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/*.app Payload/
          zip -r -q GirlsSafety.ipa Payload
          echo "IPA Created Successfully:"
          ls -lh GirlsSafety.ipa

      - name: ⬇️ Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GirlsSafety-iOS-IPA
          path: ios/GirlsSafety.ipa
          retention-days: 7
