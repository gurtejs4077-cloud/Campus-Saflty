name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: 📱 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install dependencies
        run: npm install

      - name: 🚀 Expo Prebuild (Generate iOS Native Project)
        run: npx expo prebuild --platform ios --no-install

      - name: 🔧 Patch Xcode Project Signing for Sideloading
        run: |
          cd ios
          node -e '
            const fs = require("fs");
            const files = fs.readdirSync(".").filter(f => f.endsWith(".xcodeproj"));
            for (const proj of files) {
              const pbx = `${proj}/project.pbxproj`;
              if (fs.existsSync(pbx)) {
                let content = fs.readFileSync(pbx, "utf-8");
                content = content.replace(/CODE_SIGN_STYLE = Automatic;/g, "CODE_SIGN_STYLE = Manual;");
                content = content.replace(/CODE_SIGNING_ALLOWED = YES;/g, "CODE_SIGNING_ALLOWED = NO;");
                content = content.replace(/DEVELOPMENT_TEAM = [^;]+;/g, "DEVELOPMENT_TEAM = \"\";");
                content = content.replace(/PROVISIONING_PROFILE_SPECIFIER = [^;]+;/g, "PROVISIONING_PROFILE_SPECIFIER = \"\";");
                fs.writeFileSync(pbx, content);
                console.log("Patched " + pbx);
              }
            }
          '

      - name: 🥥 Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: 🔧 Patch Pods Signing
        run: |
          cd ios
          node -e '
            const fs = require("fs");
            const pbx = "Pods/Pods.xcodeproj/project.pbxproj";
            if (fs.existsSync(pbx)) {
              let content = fs.readFileSync(pbx, "utf-8");
              content = content.replace(/CODE_SIGNING_ALLOWED = YES;/g, "CODE_SIGNING_ALLOWED = NO;");
              content = content.replace(/CODE_SIGN_STYLE = Automatic;/g, "CODE_SIGN_STYLE = Manual;");
              content = content.replace(/DEVELOPMENT_TEAM = [^;]+;/g, "DEVELOPMENT_TEAM = \"\";");
              fs.writeFileSync(pbx, content);
              console.log("Patched Pods signing settings");
            }
          '

      - name: 🛠️ Build iOS Archive (Unsigned)
        run: |
          cd ios
          export NODE_BINARY=$(which node)
          export PATH="$PATH:$(dirname $NODE_BINARY)"
          mkdir -p "$PWD/build"

          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | grep -v "Pods" | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            echo "Error: No .xcworkspace found"
            ls -la
            exit 1
          fi
          SCHEME="${WORKSPACE%.xcworkspace}"

          echo "=========================================="
          echo "Building Workspace: $WORKSPACE"
          echo "Target Scheme:      $SCHEME"
          echo "Node Binary:        $NODE_BINARY"
          echo "=========================================="

          set -o pipefail
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGNING_ALLOWED="NO" \
            CODE_SIGNING_REQUIRED="NO" \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee xcodebuild.log || {
              echo "❌❌❌ XCODEBUILD FAILED! EXACT COMPILER ERRORS:"
              grep -E "(error:|fatal error:|\*\* ARCHIVE FAILED \*\*)" xcodebuild.log | tail -n 30 || tail -n 80 xcodebuild.log
              exit 1
            }

      - name: 📦 Package into .ipa
        run: |
          cd ios
          APP_DIR=$(find build/App.xcarchive/Products/Applications -name "*.app" -type d | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "Error: No .app found in archive"
            ls -la build/App.xcarchive/Products/Applications || true
            exit 1
          fi
          echo "Found app bundle: $APP_DIR"
          mkdir -p Payload
          cp -r "$APP_DIR" Payload/
          zip -r -q GirlsSafety.ipa Payload
          echo "Successfully created IPA:"
          ls -lh GirlsSafety.ipa

      - name: ⬇️ Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GirlsSafety-iOS-IPA
          path: ios/GirlsSafety.ipa
          retention-days: 7
