name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: 📱 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install dependencies
        run: npm install

      - name: 🚀 Expo Prebuild (Generate iOS Native Project)
        run: npx expo prebuild --platform ios

      - name: 🛠️ Build Archive (Unsigned for Sideloading)
        run: |
          cd ios
          xcodebuild -workspace *.xcworkspace \
            -scheme girls-safety-app \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE=""

      - name: 📦 Package into .ipa
        run: |
          cd ios
          mkdir -p Payload
          cp -r build/App.xcarchive/Products/Applications/*.app Payload/
          zip -r GirlsSafety.ipa Payload

      - name: ⬇️ Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GirlsSafety-iOS-IPA
          path: ios/GirlsSafety.ipa
          retention-days: 7

