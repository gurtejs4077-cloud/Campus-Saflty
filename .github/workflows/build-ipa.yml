name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: 📱 Checkout repository
        uses: actions/checkout@v4

      - name: 🍏 Select Xcode
        run: |
          echo "Available Xcode installations on runner:"
          ls -d /Applications/Xcode* || true
          XCODE_APP=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP=$(find /Applications -maxdepth 1 -name "Xcode*.app" 2>/dev/null | sort -V | tail -n 1)
          fi
          echo "Selecting Xcode version: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> $GITHUB_ENV
          echo "Active Xcode Version:"
          xcodebuild -version
          echo "Active Swift Version:"
          swift --version

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install dependencies
        run: npm install

      - name: 🩹 Patch and Pre-resolve Expo SPM Dependencies
        run: |
          # 1. Remove -disableAutomaticPackageResolution and -quiet from build-xcframework.sh
          node -e '
            const fs = require("fs");
            const scriptPath = "node_modules/expo-modules-jsi/apple/scripts/build-xcframework.sh";
            if (fs.existsSync(scriptPath)) {
              let s = fs.readFileSync(scriptPath, "utf8");
              s = s.replace(/-disableAutomaticPackageResolution/g, "");
              s = s.replace(/-quiet/g, "");
              fs.writeFileSync(scriptPath, s);
              console.log("Patched build-xcframework.sh: removed -disableAutomaticPackageResolution and -quiet");
            }
          '

          # 2. Check Swift version and adjust Package.swift if needed
          SWIFT_MAJOR_MINOR=$(swift --version | grep -oE "Swift version [0-9]+\.[0-9]+" | awk '{print $3}')
          echo "Active Swift Version: $SWIFT_MAJOR_MINOR"
          node -e '
            const fs = require("fs");
            const files = [
              "node_modules/@expo/expo-modules-macros-plugin/apple/Package.swift",
              "node_modules/expo-modules-jsi/apple/Package.swift"
            ];
            const swiftVer = "'"$SWIFT_MAJOR_MINOR"'";
            console.log("Checking Package.swift files for Swift " + swiftVer);
            for (const p of files) {
              if (fs.existsSync(p)) {
                let s = fs.readFileSync(p, "utf8");
                if (parseFloat(swiftVer) < 6.2) {
                  s = s.replace(/swift-tools-version:\s*6\.2/g, "swift-tools-version: 6.0");
                  fs.writeFileSync(p, s);
                  console.log("Downgraded " + p + " to swift-tools-version: 6.0");
                }
              }
            }
          '

          # 3. Pre-resolve SPM dependencies
          for dir in "node_modules/expo-modules-jsi/apple" "node_modules/@expo/expo-modules-macros-plugin/apple"; do
            if [ -f "$dir/Package.swift" ]; then
              echo "Pre-resolving Swift packages in $dir..."
              (cd "$dir" && swift package resolve || true)
            fi
          done

      - name: 🚀 Expo Prebuild (Generate iOS Native Project)
        run: npx expo prebuild --platform ios --no-install

      - name: 🔧 Patch Xcode Project Signing for Sideloading
        run: |
          cd ios
          node -e '
            const fs = require("fs");
            const files = fs.readdirSync(".").filter(f => f.endsWith(".xcodeproj"));
            for (const proj of files) {
              const pbx = `${proj}/project.pbxproj`;
              if (fs.existsSync(pbx)) {
                let content = fs.readFileSync(pbx, "utf-8");
                content = content.replace(/CODE_SIGN_STYLE = Automatic;/g, "CODE_SIGN_STYLE = Manual;");
                content = content.replace(/CODE_SIGNING_ALLOWED = YES;/g, "CODE_SIGNING_ALLOWED = NO;");
                content = content.replace(/DEVELOPMENT_TEAM = [^;]+;/g, "DEVELOPMENT_TEAM = \"\";");
                content = content.replace(/PROVISIONING_PROFILE_SPECIFIER = [^;]+;/g, "PROVISIONING_PROFILE_SPECIFIER = \"\";");
                fs.writeFileSync(pbx, content);
                console.log("Patched " + pbx);
              }
            }
          '

      - name: 🥥 Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: 🔧 Patch Pods Signing
        run: |
          cd ios
          node -e '
            const fs = require("fs");
            const pbx = "Pods/Pods.xcodeproj/project.pbxproj";
            if (fs.existsSync(pbx)) {
              let content = fs.readFileSync(pbx, "utf-8");
              content = content.replace(/CODE_SIGNING_ALLOWED = YES;/g, "CODE_SIGNING_ALLOWED = NO;");
              content = content.replace(/CODE_SIGN_STYLE = Automatic;/g, "CODE_SIGN_STYLE = Manual;");
              content = content.replace(/DEVELOPMENT_TEAM = [^;]+;/g, "DEVELOPMENT_TEAM = \"\";");
              fs.writeFileSync(pbx, content);
              console.log("Patched Pods signing settings");
            }
          '

      - name: 🛠️ Build iOS Release (.app)
        run: |
          cd ios
          export NODE_BINARY=$(which node)
          export PATH="$PATH:$(dirname $NODE_BINARY)"
          mkdir -p "$PWD/build"

          WORKSPACE=$(ls -d *.xcworkspace 2>/dev/null | grep -v "Pods" | head -n 1)
          if [ -z "$WORKSPACE" ]; then
            echo "Error: No .xcworkspace found"
            ls -la
            exit 1
          fi
          SCHEME="${WORKSPACE%.xcworkspace}"

          echo "=========================================="
          echo "Building Workspace: $WORKSPACE"
          echo "Target Scheme:      $SCHEME"
          echo "Node Binary:        $NODE_BINARY"
          echo "=========================================="

          set -o pipefail
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGNING_ALLOWED="NO" \
            CODE_SIGNING_REQUIRED="NO" \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee xcodebuild.log || {
              echo "⚠️ Archive attempt logged. Checking if .app was generated or fallback to build..."
              xcodebuild build \
                -workspace "$WORKSPACE" \
                -scheme "$SCHEME" \
                -configuration Release \
                -destination 'generic/platform=iOS' \
                -derivedDataPath "$PWD/build/DerivedData" \
                CODE_SIGN_STYLE="Manual" \
                CODE_SIGNING_ALLOWED="NO" \
                CODE_SIGNING_REQUIRED="NO" \
                CODE_SIGN_IDENTITY="" \
                PROVISIONING_PROFILE="" \
                PROVISIONING_PROFILE_SPECIFIER="" \
                DEVELOPMENT_TEAM="" \
                COMPILER_INDEX_STORE_ENABLE=NO \
                2>&1 | tee -a xcodebuild.log || {
                  echo "❌❌❌ XCODEBUILD FAILED! EXACT COMPILER ERRORS:"
                  grep -E "(error:|fatal error:|\*\* ARCHIVE FAILED \*\*|\*\* BUILD FAILED \*\*)" xcodebuild.log | tail -n 50 || tail -n 100 xcodebuild.log
                  exit 1
                }
            }

      - name: 📦 Package into .ipa
        run: |
          cd ios
          APP_DIR=$(find build -name "*.app" -type d | grep -v "Pods" | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "Error: No .app found in build directory"
            find build -maxdepth 4 || true
            exit 1
          fi
          echo "Found app bundle: $APP_DIR"
          mkdir -p Payload
          cp -r "$APP_DIR" Payload/
          zip -r -q SafeRoutePlus.ipa Payload
          echo "Successfully created IPA:"
          ls -lh SafeRoutePlus.ipa

      - name: ⬇️ Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeRoutePlus-iOS-IPA
          path: ios/SafeRoutePlus.ipa
          retention-days: 7
